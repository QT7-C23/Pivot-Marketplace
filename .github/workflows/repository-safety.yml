name: Repository safety

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  initialization-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require repository policy files
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f LICENSE
          test -f SECURITY.md
          test -f CONTRIBUTING.md
          test -f docs/TRUST-MODEL.md
          test -f keys/pivot-marketplace-2026-01.json
          test -f scripts/verify-public-key-manifest.mjs

      - name: Verify the official public-key manifest
        run: |
          node --test tests/*.test.mjs
          node scripts/verify-public-key-manifest.mjs

      - name: Reject tracked signing secrets
        shell: bash
        run: |
          set -euo pipefail
          forbidden_files="$(git ls-files '*.pem' '*.key' '*.p12' '*.pfx')"
          if [[ -n "$forbidden_files" ]]; then
            echo "Signing-key file types must not be tracked:"
            echo "$forbidden_files"
            exit 1
          fi

          if git grep -n -I -E -- 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' -- .; then
            echo "Private-key material detected in tracked content."
            exit 1
          fi

      - name: Reject Pivot application source and release binaries
        shell: bash
        run: |
          set -euo pipefail
          forbidden_source="$(git ls-files | grep -E '^(src/(main|renderer|shared|publisher)/|electron\.vite\.config\.)' || true)"
          if [[ -n "$forbidden_source" ]]; then
            echo "Pivot application source belongs in its separate repository:"
            echo "$forbidden_source"
            exit 1
          fi

          forbidden_binaries="$(git ls-files '*.exe' '*.dll' '*.node' '*.asar' '*.msi' '*.appx')"
          if [[ -n "$forbidden_binaries" ]]; then
            echo "Application and native binaries must not be tracked here:"
            echo "$forbidden_binaries"
            exit 1
          fi

      - name: Prevent premature production catalog publication
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e catalog.json ]]; then
            echo "catalog.json cannot be published until the production signer and verifier are wired."
            exit 1
          fi
